name: Shared desktop verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Compile permission-owning Mac helper
        if: runner.os == 'macOS'
        env:
          CU_NATIVE_DIR: ${{ runner.temp }}/opcode-native
        run: |
          bash scripts/build-native.sh
          node scripts/test-macos-desktop.mjs
      - run: bun test
